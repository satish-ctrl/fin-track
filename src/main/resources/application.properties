spring.application.name=FinTrack

#database configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.url=${FLYWAY_URL}
spring.flyway.user=${FLYWAY_USERNAME}
spring.flyway.password=${FLYWAY_PASSWORD}

jwt.secret=${JWT_SECRET}


# Gmail SMTP Server
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Credentials environment variables se aayenge
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

app.password-reset.url=http://localhost:5173/reset-password

# SMTP Authentication
spring.mail.properties.mail.smtp.auth=true

# Secure TLS connection
spring.mail.properties.mail.smtp.starttls.enable=true

# Connection timeouts (milliseconds)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000